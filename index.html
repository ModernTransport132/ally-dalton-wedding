<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf7">
  <title>Coming Soon | Ally &amp; Dalton</title>
  <meta name="description" content="Ally and Dalton's wedding website is coming soon. Join us in Mobile, Alabama on April 17, 2027.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ally &amp; Dalton Wedding">
  <meta property="og:title" content="Ally &amp; Dalton | Coming Soon">
  <meta property="og:description" content="Our wedding website is coming soon. April 17, 2027 in Mobile, Alabama.">
  <meta property="og:url" content="https://www.allyanddalton2027.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&amp;family=Luxurious+Script&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logos/wedding-logo-navy.png">
  <style>
    :root {
      --navy: #172f60;
      --blue: #b0d5f0;
      --green: #cbdea7;
      --blush: #f4c0af;
      --paper: #fffaf7;
      --white: #ffffff;
      --muted: #52617a;
      --line: rgba(23, 47, 96, .18);
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --script: "Luxurious Script", "Brush Script MT", cursive;
      --sans: "Manrope", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--navy);
      font-family: var(--serif);
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: var(--blush);
      color: var(--navy);
    }

    .coming-soon {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(1rem, 3vw, 2.5rem);
      place-items: center;
      overflow: hidden;
      background: var(--paper) url("assets/images/blue-floral-hero.webp") center / cover no-repeat;
    }

    .coming-soon::before {
      position: absolute;
      inset: 0;
      z-index: -2;
      content: "";
      background: rgba(255, 250, 247, .72);
    }

    .coming-soon::after {
      position: absolute;
      inset: clamp(.8rem, 2.2vw, 1.8rem);
      z-index: -1;
      content: "";
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 8px rgba(255, 255, 255, .28);
      pointer-events: none;
    }

    .announcement {
      width: min(700px, calc(100vw - clamp(3.5rem, 10vw, 8rem)));
      padding: clamp(2.25rem, 6vw, 4.5rem) clamp(1.5rem, 6vw, 4rem);
      background: rgba(255, 250, 247, .88);
      text-align: center;
      box-shadow: 0 22px 52px rgba(23, 47, 96, .12);
      animation: invitation-arrival 1s cubic-bezier(.16, 1, .3, 1) both;
    }

    .monogram {
      display: block;
      width: clamp(5rem, 12vw, 7.5rem);
      height: auto;
      margin: 0 auto clamp(1.25rem, 3vw, 2rem);
    }

    h1 {
      margin: 0 0 clamp(1.25rem, 3vw, 2rem);
      font-family: var(--script);
      font-size: clamp(4.5rem, 11vw, 6rem);
      font-weight: 400;
      letter-spacing: .02em;
      line-height: .78;
      text-wrap: balance;
    }

    .message {
      margin: 0 auto .9rem;
      max-width: 19ch;
      font-size: clamp(2.1rem, 4.8vw, 3.05rem);
      font-weight: 300;
      line-height: 1.08;
      text-wrap: balance;
    }

    .note {
      max-width: 52ch;
      margin: 0 auto clamp(1.75rem, 4vw, 2.5rem);
      color: var(--muted);
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.68;
      text-wrap: pretty;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: .65rem 1rem;
      margin: 0;
      font-family: var(--sans);
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .12em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .details-separator {
      width: .32rem;
      height: .32rem;
      border-radius: 50%;
      background: var(--blush);
    }

    @keyframes invitation-arrival {
      from {
        opacity: 0;
        clip-path: inset(7% 0 7% 0);
        transform: translateY(1rem);
      }
      to {
        opacity: 1;
        clip-path: inset(0 0 0 0);
        transform: translateY(0);
      }
    }

    @media (max-width: 540px) {
      .announcement {
        width: calc(100vw - 3.25rem);
        padding-block: clamp(2rem, 8vh, 3.5rem);
        padding-inline: 1.35rem;
      }

      .details {
        flex-direction: column;
        gap: .35rem;
      }

      .details-separator {
        width: 1.5rem;
        height: 1px;
        border-radius: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .announcement { animation: none; }
    }

    @media (forced-colors: active) {
      .coming-soon { background: Canvas; }
      .coming-soon::before { background: transparent; }
      .coming-soon::after,
      .announcement { border: 1px solid CanvasText; box-shadow: none; }
    }
  </style>
</head>
<body>
  <!--
    THESIS: A finished invitation waiting quietly behind one ceremonial announcement, refusing a generic maintenance screen.
    OWN-WORLD: Warm paper, invitation navy, blue florals, formal hairlines, script names, and one lifted stationery plane.
    STORY: Guests recognize Ally and Dalton, learn that the full website is still being prepared, and know to return soon.
    FIRST VIEWPORT: A full-screen floral paper field frames one centered announcement with monogram, names, message, date, and place.
    FORM: Precisely specified temporary extension of the established Living Invitation; ranked first; seed key not-applicable-local-extension.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <main class="coming-soon">
    <section class="announcement" aria-labelledby="couple-names">
      <img class="monogram" src="assets/logos/wedding-logo-navy.png" alt="" width="857" height="642">
      <h1 id="couple-names">Ally &amp; Dalton</h1>
      <p class="message">Our wedding website is coming soon.</p>
      <p class="note">We&rsquo;re putting the finishing touches on the details for our celebration. Please check back soon.</p>
      <p class="details">
        <span>April 17, 2027</span>
        <span class="details-separator" aria-hidden="true"></span>
        <span>Mobile, Alabama</span>
      </p>
    </section>
  </main>
</body>
</html>
