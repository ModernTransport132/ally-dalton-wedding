<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:#fff;color:var(--navy);font-family:var(--font-serif)}
a{color:inherit}button{font:inherit;color:inherit}
.site-header,.site-footer{flex-shrink:0}
main{flex:1;display:grid;place-items:center;padding:64px 24px 80px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#f3f7fb 0,white 65%)}
.registry-copy{width:min(100%,660px)}
.ribbon{display:block;width:140px;height:94px;margin:0 auto 24px;color:#829bc0;overflow:visible}
.ribbon path{stroke-dasharray:420;stroke-dashoffset:0;animation:tie-ribbon 1.8s ease-out both}
h1{margin:0 0 28px;font-size:clamp(46px,6vw,64px);line-height:1.1;font-weight:400}
.registry-copy .welcome{max-width:490px;margin:0 auto;font-size:clamp(26px,3vw,32px);line-height:1.35;text-wrap:balance}
.registry-note{margin:36px auto 0;padding-top:28px;max-width:430px;position:relative}
.registry-note:before{content:'';position:absolute;top:0;left:calc(50% - 28px);width:56px;height:1px;background:#a9bad3}
.registry-note p{margin:0;font-size:22px;line-height:1.5;color:var(--ink-muted);text-wrap:pretty}
.registry-note p+p{margin-top:6px}
.registry-copy h1,.welcome,.registry-note{animation:arrive 1s cubic-bezier(.2,.7,.3,1) both}
.registry-copy h1{animation-delay:.15s}.welcome{animation-delay:.3s}.registry-note{animation-delay:.45s}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tie-ribbon{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@media(max-width:600px){main{padding:48px 28px 60px}.ribbon{width:116px;height:78px;margin-bottom:20px}.registry-note{margin-top:30px;padding-top:24px}.registry-note p{font-size:21px}}
@media(prefers-reduced-motion:reduce){.registry-copy h1,.welcome,.registry-note,.ribbon path{animation:none}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:16px;top:12px;padding:12px;background:white;z-index:30;transform:translateY(-150%)}.skip:focus{transform:none}
</style>
